# Phase 4.1 — Auth ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: jewelry-demo
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: jewelry-demo
    app.kubernetes.io/managed-by: phase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: jewelry-demo
  ports:
    - name: http
      port: 3000
      targetPort: http
