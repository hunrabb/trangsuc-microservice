# CHECKPOINT 4.0 DRAFT — NOT APPLIED; review checkpoint gates before use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales
  namespace: jewelry-demo
  labels:
    app.kubernetes.io/name: sales
    app.kubernetes.io/part-of: jewelry-demo
    app.kubernetes.io/managed-by: phase4-draft
  annotations:
    jewelry.demo/checkpoint: '4.3'
    jewelry.demo/image-status: REBUILD_REQUIRED_do_not_apply_placeholder
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 240
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sales
      app.kubernetes.io/part-of: jewelry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sales
        app.kubernetes.io/part-of: jewelry-demo
        app.kubernetes.io/managed-by: phase4-draft
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: jewelry-lab-worker
                operator: In
                values:
                - 'true'
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: sales
                app.kubernetes.io/part-of: jewelry-demo
            topologyKey: kubernetes.io/hostname
      containers:
      - name: sales
        image: jewelry/sales:phase4-build-required
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        - configMapRef:
            name: jewelry-common
        - configMapRef:
            name: sales-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sales-runtime-creds
              key: DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-demo-app
              key: RABBITMQ_URL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 750m
            memory: 512Mi
            ephemeral-storage: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - node
              - -e
              - setTimeout(() => {}, 3000)
        volumeMounts:
        - name: jwt-public
          mountPath: /run/secrets/jwt-public
          readOnly: true
        - name: postgres-ca
          mountPath: /run/secrets/postgres
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: jwt-public
        secret:
          secretName: jwt-verification
          defaultMode: 288
          items:
          - key: public.pem
            path: public.pem
      - name: postgres-ca
        secret:
          secretName: jewelry-pg-ca
          defaultMode: 288
          items:
          - key: ca.crt
            path: ca.crt
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
