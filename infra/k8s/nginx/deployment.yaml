# CHECKPOINT 4.0 DRAFT — NOT APPLIED; review checkpoint gates before use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: jewelry-demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: jewelry-demo
    app.kubernetes.io/managed-by: phase4-draft
  annotations:
    jewelry.demo/checkpoint: '4.6'
    jewelry.demo/gates: both controlled-demo React rebuilds; nginx -t; browser entry
      and trust review
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 240
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/part-of: jewelry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: jewelry-demo
        app.kubernetes.io/managed-by: phase4-draft
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: jewelry-lab-worker
                operator: In
                values:
                - 'true'
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: nginx
                app.kubernetes.io/part-of: jewelry-demo
            topologyKey: kubernetes.io/hostname
      containers:
      - name: nginx
        image: jewelry/backoffice:phase4-web-build-required
        imagePullPolicy: Never
        command:
        - nginx
        - -g
        - daemon off;
        ports:
        - name: backoffice
          containerPort: 8080
        - name: storefront
          containerPort: 8081
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
            ephemeral-storage: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: backoffice
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: backoffice
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: storefront
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: web
          mountPath: /web
          readOnly: true
        - name: tmp
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              command:
              - nginx
              - -s
              - quit
      volumes:
      - name: config
        configMap:
          name: nginx-phase4-config
      - name: web
        emptyDir:
          sizeLimit: 64Mi
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
      initContainers:
      - name: copy-backoffice
        image: jewelry/backoffice:phase4-web-build-required
        imagePullPolicy: Never
        command:
        - sh
        - -ec
        - mkdir -p /web/backoffice; cp -R /usr/share/nginx/html/. /web/backoffice/;
          test -s /web/backoffice/index.html
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
            ephemeral-storage: 256Mi
        volumeMounts:
        - name: web
          mountPath: /web
      - name: copy-storefront
        image: jewelry/storefront:phase4-web-build-required
        imagePullPolicy: Never
        command:
        - sh
        - -ec
        - mkdir -p /web/storefront; cp -R /usr/share/nginx/html/. /web/storefront/;
          test -s /web/storefront/index.html
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
            ephemeral-storage: 256Mi
        volumeMounts:
        - name: web
          mountPath: /web
