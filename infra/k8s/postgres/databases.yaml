apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: auth-db
  namespace: jewelry-demo
  labels:
    app.kubernetes.io/part-of: jewelry-demo
spec:
  cluster:
    name: jewelry-pg
  name: auth_db
  owner: auth_migrator
  databaseReclaimPolicy: retain
  schemas:
  - name: auth
    owner: auth_migrator
    ensure: present
