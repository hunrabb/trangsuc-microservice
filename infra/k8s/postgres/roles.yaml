apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: auth-migration
  namespace: jewelry-demo
  labels:
    app.kubernetes.io/part-of: jewelry-demo
spec:
  cluster:
    name: jewelry-pg
  name: auth_migrator
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  connectionLimit: 2
  passwordSecret:
    name: auth-migration-creds
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: auth-runtime
  namespace: jewelry-demo
  labels:
    app.kubernetes.io/part-of: jewelry-demo
spec:
  cluster:
    name: jewelry-pg
  name: auth_user
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  connectionLimit: 16
  passwordSecret:
    name: auth-runtime-creds
  databaseRoleReclaimPolicy: retain
