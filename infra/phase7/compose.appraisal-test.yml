name: jewelry-phase72-acceptance
services:
  postgres:
    image: postgres:16.15
    mem_limit: 384m
    shm_size: 64m
    environment:
      POSTGRES_USER: phase72_admin
      POSTGRES_PASSWORD: ${PHASE72_POSTGRES_PASSWORD:?Separate test password required}
      POSTGRES_DB: phase72_test
      SHADOW_DB_NAME: phase72_test_shadow
      AUTH_DB_PASSWORD: ${PHASE72_AUTH_PASSWORD:?Separate test password required}
      INVENTORY_DB_PASSWORD: ${PHASE72_INVENTORY_PASSWORD:?Separate test password required}
      SALES_DB_PASSWORD: ${PHASE72_SALES_PASSWORD:?Separate test password required}
      REPORT_DB_PASSWORD: ${PHASE72_REPORT_PASSWORD:?Separate test password required}
    ports: ['127.0.0.1:55433:5432']
    volumes:
      - appraisal_pg:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U phase72_admin -d phase72_test']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  appraisal_pg:
