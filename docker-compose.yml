# Chạy cả hệ thống:   docker compose up --build
# Chạy "như production" (không mở cổng dev):   docker compose -f docker-compose.yml up --build
#
# Chỉ gateway, backoffice, storefront có `ports`. Mọi service khác chỉ thấy nhau trong mạng Docker.
# Biến trong ${...} lấy từ file .env ở thư mục gốc (xem .env.example). `:?` = thiếu là dừng ngay và báo đúng tên biến.
name: jewelry

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Mọi app NestJS lắng nghe cổng 3000 trong container và có GET /health/live, GET /health/ready.
# Image node:slim không có curl/wget nên dùng fetch của Node.
x-nest-healthcheck: &nest-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

# 4 service có DB: chỉ healthy khi /health/ready trả 200 (đã thông tới Postgres và RabbitMQ).
x-ready-healthcheck: &ready-healthcheck
  <<: *nest-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

# Kiểm tra access token: mọi app NestJS. Chỉ mount file public key, read-only.
x-jwt-env: &jwt-env
  JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
  JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER chưa đặt trong .env}
  JWT_AUDIENCE_BACKOFFICE: ${JWT_AUDIENCE_BACKOFFICE:?JWT_AUDIENCE_BACKOFFICE chưa đặt trong .env}
  JWT_AUDIENCE_SHOP: ${JWT_AUDIENCE_SHOP:?JWT_AUDIENCE_SHOP chưa đặt trong .env}

x-jwt-public-volume: &jwt-public-volume ./secrets/jwt/public.pem:/run/secrets/jwt-public.pem:ro

x-static-healthcheck: &static-healthcheck
  test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

# Container chạy một lần: chờ Postgres nhận kết nối (tối đa ~60 s, quá hạn thoát mã 75), rồi `prisma migrate deploy` và thoát (mã 0).
x-migrate: &migrate
  restart: 'no'
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- Hạ tầng
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER chưa đặt trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}
      # Chỉ dùng bởi infra/postgres/init/01-init.sh (chạy một lần khi volume trống).
      SHADOW_DB_NAME: ${POSTGRES_SHADOW_DB:?POSTGRES_SHADOW_DB chưa đặt trong .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD chưa đặt trong .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD chưa đặt trong .env}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?SALES_DB_PASSWORD chưa đặt trong .env}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?REPORT_DB_PASSWORD chưa đặt trong .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 (TCP): server tạm lúc chạy script init chỉ nghe socket nên chưa tính là "sẵn sàng".
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.4.0-management
    # Tên node RabbitMQ gắn với hostname; cố định hostname để volume vẫn dùng được sau `down` rồi `up`.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?RABBITMQ_ADMIN_USER chưa đặt trong .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?RABBITMQ_ADMIN_PASSWORD chưa đặt trong .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # PHẢI chạy bằng user rabbitmq (gosu). `docker exec` mặc định là root: nếu CLI chạy trước khi server
      # kịp tạo /var/lib/rabbitmq/.erlang.cookie thì root tạo ra file đó (root:root, 0400), server (user
      # rabbitmq) đọc không được → "eacces" → container thoát mã 1. Dễ gặp khi Erlang khởi động chậm (> interval).
      #
      # `check_port_connectivity` (không dùng `ping`): thử mở kết nối TCP tới MỌI listener của node (AMQP 5672,
      # management 15672, ...). `ping` chỉ cho biết node Erlang đã chạy; listener AMQP mở sau cùng, nên với `ping`
      # container báo healthy trong khoảng ngắn mà kết nối tới 5672 vẫn bị reset (đã gặp ở 1.1b).
      test: ['CMD', 'gosu', 'rabbitmq', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *logging

  # Chạy một lần sau khi RabbitMQ healthy: tạo user ứng dụng + nạp infra/rabbitmq/definitions.json.
  rabbitmq-setup:
    image: node:24.22.2-slim
    user: node
    restart: 'no'
    working_dir: /infra
    command: ['node', 'setup.mjs']
    environment:
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:?RABBITMQ_ADMIN_USER chưa đặt trong .env}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?RABBITMQ_ADMIN_PASSWORD chưa đặt trong .env}
      RABBITMQ_APP_USER: ${RABBITMQ_APP_USER:?RABBITMQ_APP_USER chưa đặt trong .env}
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:?RABBITMQ_APP_PASSWORD chưa đặt trong .env}
    volumes:
      - ./infra/rabbitmq:/infra:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging: *logging

  # ---------------------------------------------------------------- Migration (mỗi service một container riêng)
  auth-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: migrate
      additional_contexts:
        migrate-scripts: ./infra/migrate
    image: jewelry/auth-migrate:dev
    environment:
      DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=auth

  inventory-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: apps/inventory/Dockerfile
      target: migrate
      additional_contexts:
        migrate-scripts: ./infra/migrate
    image: jewelry/inventory-migrate:dev
    environment:
      DATABASE_URL: postgresql://inventory_user:${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=inventory

  sales-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: apps/sales/Dockerfile
      target: migrate
      additional_contexts:
        migrate-scripts: ./infra/migrate
    image: jewelry/sales-migrate:dev
    environment:
      DATABASE_URL: postgresql://sales_user:${SALES_DB_PASSWORD:?SALES_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=sales

  report-migrate:
    <<: *migrate
    build:
      context: .
      dockerfile: apps/report/Dockerfile
      target: migrate
      additional_contexts:
        migrate-scripts: ./infra/migrate
    image: jewelry/report-migrate:dev
    environment:
      DATABASE_URL: postgresql://report_user:${REPORT_DB_PASSWORD:?REPORT_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=report

  # ---------------------------------------------------------------- Dịch vụ nghiệp vụ (KHÔNG mở cổng ra ngoài)
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    image: jewelry/auth:dev
    restart: unless-stopped
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: '3000'
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID chưa đặt trong .env}
      DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=auth
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:?DATABASE_POOL_MAX chưa đặt trong .env}
      RABBITMQ_URL: amqp://${RABBITMQ_APP_USER:?RABBITMQ_APP_USER chưa đặt trong .env}:${RABBITMQ_APP_PASSWORD:?RABBITMQ_APP_PASSWORD chưa đặt trong .env}@rabbitmq:5672
    volumes:
      - *jwt-public-volume
      # Chỉ auth có private key.
      - ./secrets/jwt/private.pem:/run/secrets/jwt-private.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully
      auth-migrate:
        condition: service_completed_successfully
    healthcheck: *ready-healthcheck
    logging: *logging

  inventory:
    build:
      context: .
      dockerfile: apps/inventory/Dockerfile
    image: jewelry/inventory:dev
    restart: unless-stopped
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://inventory_user:${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=inventory
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:?DATABASE_POOL_MAX chưa đặt trong .env}
      RABBITMQ_URL: amqp://${RABBITMQ_APP_USER:?RABBITMQ_APP_USER chưa đặt trong .env}:${RABBITMQ_APP_PASSWORD:?RABBITMQ_APP_PASSWORD chưa đặt trong .env}@rabbitmq:5672
    volumes:
      - *jwt-public-volume
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully
      inventory-migrate:
        condition: service_completed_successfully
    healthcheck: *ready-healthcheck
    logging: *logging

  sales:
    build:
      context: .
      dockerfile: apps/sales/Dockerfile
    image: jewelry/sales:dev
    restart: unless-stopped
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://sales_user:${SALES_DB_PASSWORD:?SALES_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=sales
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:?DATABASE_POOL_MAX chưa đặt trong .env}
      RABBITMQ_URL: amqp://${RABBITMQ_APP_USER:?RABBITMQ_APP_USER chưa đặt trong .env}:${RABBITMQ_APP_PASSWORD:?RABBITMQ_APP_PASSWORD chưa đặt trong .env}@rabbitmq:5672
    volumes:
      - *jwt-public-volume
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully
      sales-migrate:
        condition: service_completed_successfully
    healthcheck: *ready-healthcheck
    logging: *logging

  report:
    build:
      context: .
      dockerfile: apps/report/Dockerfile
    image: jewelry/report:dev
    restart: unless-stopped
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://report_user:${REPORT_DB_PASSWORD:?REPORT_DB_PASSWORD chưa đặt trong .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB chưa đặt trong .env}?schema=report
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:?DATABASE_POOL_MAX chưa đặt trong .env}
      RABBITMQ_URL: amqp://${RABBITMQ_APP_USER:?RABBITMQ_APP_USER chưa đặt trong .env}:${RABBITMQ_APP_PASSWORD:?RABBITMQ_APP_PASSWORD chưa đặt trong .env}@rabbitmq:5672
    volumes:
      - *jwt-public-volume
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully
      report-migrate:
        condition: service_completed_successfully
    healthcheck: *ready-healthcheck
    logging: *logging

  # ---------------------------------------------------------------- Cửa vào (có mở cổng)
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    image: jewelry/gateway:dev
    restart: unless-stopped
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: '3000'
      AUTH_URL: http://auth:3000
      INVENTORY_URL: http://inventory:3000
      SALES_URL: http://sales:3000
      REPORT_URL: http://report:3000
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.0.16/31}
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    volumes:
      - *jwt-public-volume
    depends_on:
      inventory:
        condition: service_healthy
    healthcheck: *nest-healthcheck
    logging: *logging

  backoffice:
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: jewelry/backoffice:dev
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.16
    ports:
      - '${BACKOFFICE_PORT:-8080}:8080'
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck: *static-healthcheck
    logging: *logging

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    image: jewelry/storefront:dev
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.17
    ports:
      - '${STOREFRONT_PORT:-8081}:8080'
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck: *static-healthcheck
    logging: *logging

# Mạng cố định để gán IP tĩnh cho hai nginx: gateway chỉ tin X-Forwarded-For từ đúng hai địa chỉ đó (TRUSTED_PROXIES).
# Không tin cả mạng, vì kết nối từ ngoài qua cổng đã mở của gateway có thể mang địa chỉ bridge 172.30.0.1.
# Các container khác nhận IP trong ip_range, nên không trùng hai địa chỉ này.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          ip_range: 172.30.0.128/25

volumes:
  pg_data:
  rabbitmq_data:
