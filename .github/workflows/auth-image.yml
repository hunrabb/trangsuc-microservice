name: Auth image (GHCR)

on:
  push:
    branches: [feat/k8s-phase4]
    paths:
      - .github/workflows/auth-image.yml
      - apps/auth/**
      - libs/**
      - tests/test-utils/**
      - scripts/ci/audit-auth-image.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - tsconfig*.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contain-public-image:
    if: >-
      ${{ github.ref == 'refs/heads/feat/k8s-phase4' && startsWith(github.event.head_commit.message, '[auth-image-only] contain') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove the new package only if it contains exactly our failed publish
        shell: bash
        run: |
          set -euo pipefail
          api=/users/hunrabb/packages/container/trangsuc-microservice-auth
          gh api "$api" > "$RUNNER_TEMP/package.json"
          jq '{name,visibility,repository:.repository.full_name}' "$RUNNER_TEMP/package.json"
          jq -e '.name == "trangsuc-microservice-auth" and .repository.full_name == "hunrabb/trangsuc-microservice"' "$RUNNER_TEMP/package.json"
          gh api "${api}/versions" > "$RUNNER_TEMP/versions.json"
          jq -e 'length == 1' "$RUNNER_TEMP/versions.json"
          id=$(jq -er '[.[] | select(.name == "sha256:1ea3e7864999515e39d1fffbea48bb405141edb625c810981aa932ea45ebb28b" and (.metadata.container.tags | index("sha-3d37a779b6875cb1f722ae8b40f48f9da08c25ac")))] | if length == 1 then .[0].id else error("Expected exactly the new Auth image version") end' "$RUNNER_TEMP/versions.json")
          test -n "$id"
          gh api --method DELETE "$api"
          echo 'Removed the new package containing only the image from run 43399005581.' >> "$GITHUB_STEP_SUMMARY"

  auth:
    if: >-
      ${{ github.ref == 'refs/heads/feat/k8s-phase4' && !startsWith(github.event.head_commit.message, '[auth-image-only] contain') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select image and require private package
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package=trangsuc-microservice-auth
          echo "AUTH_IMAGE=ghcr.io/${owner}/${package}" >> "$GITHUB_ENV"
          echo "AUTH_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "PACKAGE_API=/users/${owner}/packages/container/${package}" >> "$GITHUB_ENV"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/users/${owner}/packages/container/${package}")
          case "$status" in
            200) jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json" ;;
            404) echo '::error::Pre-create and verify a private GHCR package before publishing; refusing implicit visibility defaults.'; exit 1 ;;
            *) echo "::error::Package visibility check failed (HTTP ${status})"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build only Auth runtime on GitHub-hosted runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/auth/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.AUTH_IMAGE }}:${{ env.AUTH_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=auth-runtime-amd64
          cache-to: type=gha,mode=max,scope=auth-runtime-amd64
          provenance: false

      - name: Audit runtime before publishing
        shell: bash
        run: |
          set -euo pipefail
          ref="${AUTH_IMAGE}:${AUTH_TAG}"
          docker image inspect "$ref" | jq -e \
            '.[0] | .Architecture == "amd64" and .Os == "linux" and .Config.User == "node"'
          docker run --rm --network none --read-only --memory 256m \
            --entrypoint node -i "$ref" < scripts/ci/audit-auth-image.mjs

      - name: Publish private GHCR image and record immutable digest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          ref="${AUTH_IMAGE}:${AUTH_TAG}"
          docker push "$ref"
          gh api "$PACKAGE_API" --jq .visibility | grep -x private
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-metadata
          jq -n --arg image "$AUTH_IMAGE" --arg tag "$AUTH_TAG" --arg digest "$digest" \
            --arg commit "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_RUN_ID" \
            '{image:$image,tag:$tag,digest:$digest,reference:($image+"@"+$digest),commit:$commit,repository:$repository,runId:$run,platform:"linux/amd64",visibility:"private",target:"runtime"}' \
            > image-metadata/auth-image.json
          cat image-metadata/auth-image.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: auth-image-${{ github.sha }}
          path: image-metadata/auth-image.json
          if-no-files-found: error
          retention-days: 14
