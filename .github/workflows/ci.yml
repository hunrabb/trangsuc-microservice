name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Phiên bản pnpm lấy từ `packageManager` trong package.json.
      - uses: pnpm/action-setup@v6

      # Phiên bản Node lấy từ .nvmrc; cache kho pnpm theo pnpm-lock.yaml.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Định dạng (Prettier)
        run: pnpm format:check

      - name: OpenAPI
        run: pnpm openapi:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Sinh khoá JWT
        run: pnpm keys:generate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Test outbox/consumer và phiên đăng nhập cần Postgres và RabbitMQ thật, đúng topology trong definitions.json.
      # Mật khẩu ngẫu nhiên cho từng lần chạy; override mở cổng 127.0.0.1 cho test trên máy runner.
      - name: Hạ tầng cho test
        run: |
          cp .env.example .env
          for name in $(grep -E '^[A-Z_]*PASSWORD=$' .env.example | cut -d= -f1); do
            password=$(openssl rand -hex 24)
            echo "::add-mask::${password}"
            sed -i -E "s/^${name}=$/${name}=${password}/" .env
          done
          docker compose up -d --wait postgres rabbitmq
          docker compose run --rm rabbitmq-setup

      # Cấu hình tách DB đang ở chế độ chuẩn bị; CI hiện vẫn kiểm thử stack legacy.
      - name: Kiểm tra cấu hình Compose bốn DB độc lập
        run: |
          docker compose -f docker-compose.db-separated.yml config -q
          docker compose --env-file .env -p jewelry-db-separation-test \
            -f infra/postgres/separation/compose.test.yml config -q
          python3 infra/postgres/separation/verify-compose.py
          bash -n infra/postgres/service-init/01-init.sh infra/postgres/separation/test-restore.sh

      - name: Test hạ tầng (outbox, consumer, retry, DLQ, phiên đăng nhập)
        run: pnpm test:infra

  docker:
    name: docker compose build
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Compose cần đủ biến trong .env để đọc file (build không dùng đến mật khẩu).
      # Điền giá trị giả cho mọi biến *_PASSWORD còn trống.
      - name: Tạo .env giả cho bước build
        run: |
          cp .env.example .env
          sed -i -E 's/^([A-Z_]*PASSWORD)=$/\1=ci-khong-phai-mat-khau-that/' .env

      - name: Build toàn bộ image
        run: docker compose -f docker-compose.yml build

  # Chạy thật cả hệ thống: mọi container phải healthy, các *-migrate và rabbitmq-setup phải thoát mã 0,
  # rồi gọi gateway → inventory qua /api/ping. Job `docker` ở trên chỉ chứng minh image build được.
  smoke:
    name: Smoke test (docker compose up)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Mật khẩu ngẫu nhiên cho từng lần chạy, che khỏi log (::add-mask::), không bao giờ in ra.
      - name: Tạo .env với mật khẩu ngẫu nhiên
        run: |
          cp .env.example .env
          for name in $(grep -E '^[A-Z_]*PASSWORD=$' .env.example | cut -d= -f1); do
            password=$(openssl rand -hex 24)
            echo "::add-mask::${password}"
            sed -i -E "s/^${name}=$/${name}=${password}/" .env
          done
          if grep -qE '^[A-Z_]+=$' .env; then
            echo "::error::.env còn biến trống: $(grep -E '^[A-Z_]+=$' .env | cut -d= -f1 | tr '\n' ' ')"
            exit 1
          fi

      # Cần Node phiên bản trong .nvmrc để chạy script sinh khoá. auth chạy bằng uid 1000 trong container, còn
      # file do uid của runner tạo với quyền 600, nên phải mở quyền đọc (khoá dùng một lần, không phải bí mật thật).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Sinh khoá JWT
        run: |
          node scripts/generate-jwt-keys.mjs
          chmod 644 secrets/jwt/private.pem

      # CHỈ docker-compose.yml (`-f`): không nạp docker-compose.override.yml (cấu hình dev, mở Postgres/RabbitMQ ra
      # 127.0.0.1), để thử đúng cấu hình production. Mọi lệnh compose trong job này đều có `-f docker-compose.yml`.
      # --wait: chờ mọi service chạy lâu `healthy`; lỗi nếu có container thoát khác 0 (kể cả *-migrate, rabbitmq-setup).
      - name: Khởi động hệ thống (chỉ docker-compose.yml, không có override)
        run: docker compose -f docker-compose.yml up -d --build --wait

      - name: Trạng thái container
        run: docker compose -f docker-compose.yml ps -a

      # Bằng chứng trong log rằng override KHÔNG được nạp: chỉ 3 service này có cổng ra máy chủ; Postgres (5432)
      # và RabbitMQ (5672, 15672) không được mở. Nạp override thì bước này thất bại.
      - name: Chỉ gateway, backoffice, storefront mở cổng ra máy chủ
        run: |
          published=$(docker compose -f docker-compose.yml ps --format json \
            | jq -rs 'flatten | map(select(any(.Publishers[]?; .PublishedPort > 0))) | map(.Service) | sort | join(",")')
          echo "Service có cổng mở ra máy chủ: ${published}"
          if [ "${published}" != "backoffice,gateway,storefront" ]; then
            echo "::error::Mong đợi đúng backoffice,gateway,storefront. Có thể docker-compose.override.yml đã bị nạp."
            exit 1
          fi

      - name: Gateway → inventory qua /api/ping
        run: |
          port=$(grep -E '^GATEWAY_PORT=' .env | cut -d= -f2)
          body=$(curl --silent --show-error --fail --retry 5 --retry-delay 2 --retry-connrefused "http://localhost:${port}/api/ping")
          echo "Phản hồi: ${body}"
          expected='{"service":"inventory","ok":true}'
          if [ "${body}" != "${expected}" ]; then
            echo "::error::Phản hồi /api/ping sai. Mong đợi ${expected}"
            exit 1
          fi

      # Đi qua nginx thật, kèm X-Forwarded-For giả: auth phải ghi địa chỉ nginx thấy, không phải địa chỉ giả
      # và cũng không phải địa chỉ của chính nginx.
      - name: IP thật đi qua nginx và gateway
        run: |
          port=$(grep -E '^BACKOFFICE_PORT=' .env | cut -d= -f2)
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST "http://localhost:${port}/api/auth/login" \
            -H 'content-type: application/json' -H 'x-forwarded-for: 9.9.9.9' \
            -d '{"email":"smoke@example.invalid","password":"khong-dung"}')
          echo "HTTP ${status}"
          ip=$(docker compose -f docker-compose.yml exec -T postgres sh -c \
            'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT data->>'"'"'ip'"'"' FROM auth.\"AuditLog\" WHERE data->>'"'"'email'"'"' = '"'"'smoke@example.invalid'"'"'"')
          echo "IP ghi nhận: ${ip}"
          case "${ip}" in
            ''|9.9.9.9|172.30.0.16|172.30.0.17)
              echo "::error::IP ghi nhận sai: '${ip}'"
              exit 1
              ;;
          esac

      - name: Log của mọi container (khi thất bại)
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps -a
          docker compose -f docker-compose.yml logs --no-color --timestamps

      - name: Dọn dẹp
        if: always()
        run: docker compose -f docker-compose.yml down -v
