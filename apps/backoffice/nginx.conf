# Web server phục vụ file tĩnh + chuyển /api/* về gateway (cùng origin → không cần CORS,
# cookie refresh token SameSite=Strict về sau cũng chạy được). CHỈ /api/* được chuyển về gateway;
# /internal/* luôn trả 404 (xem bên dưới).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # DNS nội bộ của Docker; phân giải lại mỗi 10 giây để gateway khởi động lại (đổi IP) không làm hỏng proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $gateway http://gateway:3000;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  # /internal/* là đường nội bộ giữa các service, KHÔNG bao giờ ra ngoài. Không có khối này thì nó rơi vào
  # fallback của SPA ở cuối file và nhận index.html với HTTP 200 (trông như tồn tại). `^~` thắng mọi location
  # regex. nginx đã chuẩn hoá URI (gộp //, giải mã %xx, bỏ /./ và /../) trước khi so khớp, nên các biến thể như
  # //internal/ping hay /%69nternal/ping cũng rơi vào đây.
  location = /internal {
    return 404;
  }

  location ^~ /internal/ {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Ứng dụng một trang: mọi đường khác trả index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
}
