openapi: 3.1.0
info:
  title: Sales POS, Online Payments and Buyback Intake API
  version: 1.0.0
  description: >-
    Đường ở gateway. Chỉ ADMIN toàn hệ thống hoặc STAFF/MANAGER đúng chi nhánh.
    Tiền và trọng lượng là chuỗi thập phân. Không nhận giá, channel hay status từ client.
    CREATING/CANCELLING là bước nội bộ có lease 60 giây; gửi lại cùng key để tiếp tục khi bị gián đoạn.
    Mỗi lượt HTTP inventory timeout 3 giây, retry tối đa hai lần chỉ với lỗi tạm thời.
security:
  - bearerAuth: []
paths:
  /api/admin/sales/branches/{branchId}/buybacks:
    post:
      operationId: createBuybackIntake
      summary: Tạo phiếu DRAFT; cùng actor/branch/key và nội dung chuẩn hoá trả cùng phiếu
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBuyback' }
      responses:
        '201':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackDetail' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
    get:
      operationId: listBuybackIntakes
      summary: Danh sách trong chi nhánh theo receivedAt DESC rồi id DESC
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/BuybackStatus' } }
        - { in: query, name: from, description: 'receivedAt >= from, UTC; from <= to', schema: { type: string, format: date-time } }
        - { in: query, name: to, description: 'receivedAt <= to, UTC', schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackPage' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
  /api/admin/sales/branches/{branchId}/buybacks/by-key:
    get:
      operationId: getBuybackIntakeByKey
      summary: Tra key của chính actor trong chi nhánh; không đưa key vào URL
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackDetail' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
  /api/admin/sales/branches/{branchId}/buybacks/{id}:
    get:
      operationId: getBuybackIntake
      summary: Xem phiếu và tối đa 50 audit gần nhất theo version giảm dần
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackDetail' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
    put:
      operationId: updateBuybackIntake
      summary: Thay toàn bộ nội dung DRAFT; STAFF chỉ sửa phiếu của mình
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBuyback' }
      responses:
        '200':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackDetail' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
  /api/admin/sales/branches/{branchId}/buybacks/{id}/submit:
    post:
      operationId: submitBuybackIntake
      summary: DRAFT sang PENDING_APPRAISAL; STAFF chỉ gửi phiếu của mình
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitBuyback' }
      responses:
        '200':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackDetail' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
  /api/admin/sales/branches/{branchId}/buybacks/{id}/cancel:
    post:
      operationId: cancelBuybackIntake
      summary: STAFF huỷ DRAFT của mình; MANAGER/ADMIN huỷ DRAFT hoặc PENDING_APPRAISAL
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelBuyback' }
      responses:
        '200':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackDetail' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
  /api/admin/sales/branches/{branchId}/online-orders/{orderId}/payments/confirm:
    post:
      operationId: confirmOnlineBankReceipt
      summary: ADMIN hoặc MANAGER đúng chi nhánh xác minh tiền nhận từ sao kê
      x-roles: [ADMIN, MANAGER]
      description: >-
        Xác nhận thủ công có trách nhiệm sau khi kiểm chứng tiền vào tài khoản doanh nghiệp.
        Không dành cho khách và không phải webhook. Currency VND và số tiền phải khớp giá backend.
        bankTxnRef là reference ngân hàng có namespace tài khoản; evidenceRef tham chiếu dòng sao kê.
        Receipt và outbox order.paid lưu atomically. Đơn chỉ CONFIRMED sau phản hồi Inventory.
        Giao dịch đến muộn hoặc giao dịch thực bổ sung được lưu REFUND_PENDING, chưa hoàn tiền.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmOnlinePayment' }
      responses:
        '200':
          description: Giao dịch bền vững hoặc kết quả idempotent; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlinePayment' }
        '400': { description: Body/header/currency không hợp lệ }
        '401': { description: Cần token nhân viên }
        '403': { description: Không đúng quyền ADMIN/MANAGER chi nhánh }
        '404': { description: Không có đơn ở chi nhánh }
        '409': { description: PAYMENT_AMOUNT_MISMATCH hoặc PAYMENT_REFERENCE_CONFLICT hoặc PAYMENT_RECONCILIATION_REQUIRED }
        '422': { description: IDEMPOTENCY_KEY_REUSED }
        '429': { description: Vượt 20 payment POST/phút/IP }
  /api/admin/sales/branches/{branchId}/online-orders/{orderId}/payments:
    get:
      operationId: listOnlinePaymentsForReconciliation
      summary: Xem tối đa 50 receipt mới nhất để đối soát thủ công
      x-roles: [ADMIN, MANAGER]
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Dữ liệu chỉ dành cho nhân viên có quyền; Cache-Control no-store
          content:
            application/json:
              schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/OnlinePaymentAdmin' } }
        '401': { description: Cần token nhân viên }
        '403': { description: Không có quyền }
        '404': { description: Không có đơn tại chi nhánh }
  /api/admin/sales/branches/{branchId}/online-orders/{orderId}/payments/{paymentId}/refund-request:
    post:
      operationId: requestOnlineRefund
      summary: Ghi yêu cầu hoàn tiền; không chuyển tiền hoặc xác nhận đã hoàn
      x-roles: [ADMIN, MANAGER]
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: paymentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestOnlineRefund' }
      responses:
        '200':
          description: REFUND_PENDING; retry không tạo yêu cầu lần hai và không có REFUNDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlinePayment' }
        '400': { description: Body không hợp lệ }
        '401': { description: Cần token nhân viên }
        '403': { description: Không có quyền }
        '404': { description: Không có đơn/giao dịch tại chi nhánh }
        '429': { description: Vượt 20 payment POST/phút/IP }

  /api/pos/orders:
    post:
      operationId: createPosOrder
      summary: Tạo hoá đơn POS hoặc trả cùng hoá đơn đã tạo
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Cùng key và cùng branchId/bộ mã tem trả cùng id; thứ tự mã tem không có ý nghĩa.
        Key khác nội dung trả 422. Hết hàng trả 409 ITEM_NOT_AVAILABLE kèm details.tagCodes và orderId;
        giữ đơn CANCELLED không có dòng bán. Lỗi hạ tầng trả 503, không đổi thành hết hàng.
        Nếu trả kho lỗi, đơn giữ CANCELLING để request cùng key tiếp tục release.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePosOrderRequest' }
      responses:
        '201':
          description: Hoá đơn mới hoặc phát lại cùng key, snapshot lấy từ deduct
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosOrder' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StockConflict' }
        '422':
          description: IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/pos/orders/by-key/{key}:
    get:
      operationId: getPosOrderByKey
      summary: Tra trạng thái hoá đơn sau timeout theo Idempotency-Key
      x-roles: [ADMIN, MANAGER, STAFF]
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/pos/orders/{id}:
    get:
      operationId: getPosOrder
      summary: Xem trạng thái và snapshot hoá đơn
      x-roles: [ADMIN, MANAGER, STAFF]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/pos/orders/{id}/confirm-payment:
    post:
      operationId: confirmPosPayment
      summary: Xác nhận đã nhận chuyển khoản
      x-roles: [ADMIN, MANAGER, STAFF]
      description: UPDATE PENDING_PAYMENT sang COMPLETED; lần thứ hai hoặc đua huỷ thua trả 409.
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
