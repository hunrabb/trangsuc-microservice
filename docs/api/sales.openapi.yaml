openapi: 3.1.0
info:
  title: Sales POS, Online Payments, Buyback Appraisal and Settlement API
  version: 1.0.0
  description: >-
    Đường ở gateway. Chỉ ADMIN toàn hệ thống hoặc STAFF/MANAGER đúng chi nhánh.
    Tiền và trọng lượng là chuỗi thập phân. Không nhận giá, channel hay status từ client.
    CREATING/CANCELLING là bước nội bộ có lease 60 giây; gửi lại cùng key để tiếp tục khi bị gián đoạn.
    Mỗi lượt HTTP inventory timeout 3 giây, retry tối đa hai lần chỉ với lỗi tạm thời.
security:
  - bearerAuth: []
paths:
  /api/admin/sales/branches/{branchId}/buybacks/{id}/settlements:
    post:
      operationId: createDirectBuybackSettlement
      x-audience: store-backoffice
      x-roles: [ADMIN, MANAGER, STAFF]
      summary: Create direct buyback payout intent from an approved quote
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSettlement' }
      responses:
        '201': { description: Payout intent; no money has moved, content: { application/json: { schema: { $ref: '#/components/schemas/BuybackSettlement' } } } }
        '409': { description: 'Quote not approved, version conflict or already active settlement' }
    get:
      operationId: getBuybackSettlement
      x-audience: store-backoffice
      x-roles: [ADMIN, MANAGER, STAFF]
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Latest settlement or null, content: { application/json: { schema: { anyOf: [ { $ref: '#/components/schemas/BuybackSettlement' }, { type: 'null' } ] } } } }
  /api/admin/sales/branches/{branchId}/buybacks/{id}/exchanges:
    post:
      operationId: createJewelryExchange
      x-audience: store-backoffice
      x-roles: [ADMIN, MANAGER, STAFF]
      summary: Reserve one tagged Inventory item and snapshot sale price
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExchange' }
      responses:
        '201': { description: Reservation state and Decimal difference, content: { application/json: { schema: { $ref: '#/components/schemas/BuybackSettlement' } } } }
        '409': { description: Approved quote or item unavailable }
  /api/admin/sales/branches/{branchId}/buybacks/{id}/settlements/{settlementId}/payment:
    post:
      operationId: recordBuybackPaymentEvidence
      x-audience: store-backoffice
      x-roles: [ADMIN, MANAGER, STAFF]
      summary: Record cash receipt or bank reference; does not confirm money moved
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordSettlementPayment' }
      responses:
        '200': { description: Payment evidence recorded, content: { application/json: { schema: { $ref: '#/components/schemas/BuybackSettlement' } } } }
        '409': { description: 'Duplicate payment reference, stale version or invalid state' }
  /api/admin/sales/branches/{branchId}/buybacks/{id}/settlements/{settlementId}/confirm:
    post:
      operationId: confirmBuybackPayment
      x-audience: store-backoffice
      x-roles: [ADMIN, MANAGER]
      summary: Manager attests actual payment and handover; exchange fulfills via Inventory
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmSettlementPayment' }
      responses:
        '200': { description: Settled or reconciliation required, content: { application/json: { schema: { $ref: '#/components/schemas/BuybackSettlement' } } } }
        '403': { description: Manager scope or separate confirmer required }
        '409': { description: Stale version or invalid state }
  /api/admin/sales/branches/{branchId}/buybacks/{id}/settlements/{settlementId}/cancel:
    post:
      operationId: cancelBuybackSettlement
      x-audience: store-backoffice
      x-roles: [ADMIN, MANAGER, STAFF]
      summary: Cancel before payment is recorded and release Inventory reservation
      parameters:
        - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelSettlement' }
      responses:
        '200': { description: Cancelled or release pending, content: { application/json: { schema: { $ref: '#/components/schemas/BuybackSettlement' } } } }
        '409': { description: Payment already recorded or terminal state }
  /api/admin/sales/branches/{branchId}/buybacks/price-policies:
    get:
      operationId: listBuybackPricePolicies
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
        - MANAGER
        - STAFF
      description: "Policies scoped to the authorized branch; at most 100, ordered by ID. Cache-Control:
        no-store."
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/BuybackPolicy"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
    post:
      operationId: createBuybackPricePolicy
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
      description: ADMIN configures explicit alloy/fineness mapping and fixed VND deduction per physical
        item. No default deduction or market price. Retry of the original create key returns the
        current policy without another audit.
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "201":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackPolicy"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuybackPolicy"
  /api/admin/sales/branches/{branchId}/buybacks/price-policies/{policyId}:
    put:
      operationId: updateBuybackPricePolicy
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
      description: ADMIN updates deduction/label/active flag with version CAS and a required reason.
        Metal/fineness identity is fixed. Existing quote snapshots remain unchanged. Stale version
        returns 409.
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: policyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackPolicy"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBuybackPolicy"
  /api/admin/sales/branches/{branchId}/buybacks/{id}/appraisals:
    get:
      operationId: getBuybackAppraisals
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
        - MANAGER
        - STAFF
      description: Current immutable appraisal revision per item; includes the current header version.
        Original intake measurements remain separate.
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackAppraisals"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
  /api/admin/sales/branches/{branchId}/buybacks/{id}/items/{itemId}/appraisal:
    put:
      operationId: recordBuybackAppraisal
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
        - MANAGER
        - STAFF
      description: Weights are strings in chi; acceptedWeight must not exceed measuredWeight. Fineness is
        per mille in (0,1000]. Appends a revision and supersedes the current unapproved quote. Same
        Idempotency-Key/body replays the original result.
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: itemId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackAppraisal"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppraisalInput"
  /api/admin/sales/branches/{branchId}/buybacks/{id}/quotes:
    post:
      operationId: quoteBuyback
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
        - MANAGER
        - STAFF
      description: "Requires every item and its active policy/version. Reads Inventory buyPrice outside
        the transaction, then rechecks header/policy versions. Alloy rate already includes fineness:
        amount=HALF_UP((acceptedWeight*buyPrice-fixedDeduction)/1000)*1000 per line;
        total=sum(lines). No client price or payout. Same key/body replays the original quote."
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "201":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackQuote"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuybackQuoteInput"
    get:
      operationId: getBuybackQuotes
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
        - MANAGER
        - STAFF
      description: Current header version/activeQuoteId and the latest 50 immutable quote snapshots
        including superseded/terminal history.
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackQuotes"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
  /api/admin/sales/branches/{branchId}/buybacks/{id}/quotes/{quoteId}/approve:
    post:
      operationId: approveBuybackQuote
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
        - MANAGER
      description: Only the active QUOTED snapshot with complete current appraisals may be approved.
        Approver must differ from intake creator, quote creator and current appraisers, including
        ADMIN. Locks/CAS/audit/request are atomic; same key/body replays the original decision. No
        repricing, payout or stock receipt.
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: quoteId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackQuote"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuybackDecision"
  /api/admin/sales/branches/{branchId}/buybacks/{id}/quotes/{quoteId}/reject:
    post:
      operationId: rejectBuybackQuote
      security:
        - bearerAuth: []
      x-audience: store-backoffice
      x-roles:
        - ADMIN
        - MANAGER
      description: Manager in the actual branch or global ADMIN rejects the active quote with a required
        reason. Version/CAS, decision audit and idempotent request are atomic. REJECTED is terminal
        in Task 7.2.
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: quoteId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Success; pricing snapshot retains its source price and rounding policy
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuybackQuote"
        "400":
          description: "VALIDATION_FAILED: strict DTO/UUID/header"
        "401":
          description: Backoffice token required
        "403":
          description: FORBIDDEN or BUYBACK_SEPARATE_APPROVER_REQUIRED
        "404":
          description: NOT_FOUND in authorized branch
        "409":
          description: VERSION_CONFLICT, INVALID_STATE, BUYBACK_POLICY_REQUIRED, BUYBACK_APPRAISAL_INCOMPLETE
            or BUYBACK_PRICE_INVALID
        "422":
          description: IDEMPOTENCY_KEY_REUSED
        "503":
          description: "SERVICE_UNAVAILABLE: price source or lock timeout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectBuybackQuote"
  /api/admin/sales/branches/{branchId}/buybacks:
    post:
      operationId: createBuybackIntake
      summary: Tạo phiếu DRAFT; cùng actor/branch/key và nội dung chuẩn hoá trả cùng phiếu
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
        Mỗi dòng là một món, tối đa 20; trọng lượng chỉ là khai báo hoặc đo ban đầu, đơn vị chỉ.
        STORE_TAG là tham chiếu chưa xác minh. Cache-Control no-store; token backoffice bắt buộc.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBuyback' }
      responses:
        '201':
          description: Snapshot phiếu hiện tại; không trả idempotency key/hash. PUT thay mới ID dòng khi còn DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuybackDetail' }
        '400': { description: VALIDATION_FAILED hoặc UUID/header không hợp lệ; không nhận giá/status/actor từ client }
        '401': { description: Cần token nhân viên backoffice }
        '403': { description: FORBIDDEN; không có quyền chi nhánh hoặc STAFF sửa phiếu người khác }
        '404': { description: NOT_FOUND trong phạm vi chi nhánh/actor được phép }
        '409': { description: VERSION_CONFLICT hoặc INVALID_STATE; tải lại phiếu trước khi thao tác }
        '422': { description: IDEMPOTENCY_KEY_REUSED khi tạo lại cùng key nhưng nội dung khác }
        '503': { description: SERVICE_UNAVAILABLE khi hết thời gian chờ khoá }
    get:
      operationId: listBuybackIntakes
      summary: Danh sách trong chi nhánh theo receivedAt DESC rồi id DESC
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Chỉ tiếp nhận thông tin, không kiểm định/định giá/chi tiền/nhập kho/chuyển quyền sở hữu.
