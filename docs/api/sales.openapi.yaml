  /api/admin/sales/branches/{branchId}/online-orders/{orderId}/payments/confirm:
    post:
      operationId: confirmOnlineBankReceipt
      summary: ADMIN hoặc MANAGER đúng chi nhánh xác minh tiền nhận từ sao kê
      x-roles: [ADMIN, MANAGER]
      description: >-
        Xác nhận thủ công có trách nhiệm sau khi kiểm chứng tiền vào tài khoản doanh nghiệp.
        Không dành cho khách và không phải webhook. Currency VND và số tiền phải khớp giá backend.
        bankTxnRef là reference ngân hàng có namespace tài khoản; evidenceRef tham chiếu dòng sao kê.
        Receipt và outbox order.paid lưu atomically. Đơn chỉ CONFIRMED sau phản hồi Inventory.
        Giao dịch đến muộn hoặc giao dịch thực bổ sung được lưu REFUND_PENDING, chưa hoàn tiền.
      parameters:
        - { in: path, name: branchId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmOnlinePayment' }
      responses:
        '200':
          description: Giao dịch bền vững hoặc kết quả idempotent; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlinePayment' }
        '400': { description: Body/header/currency không hợp lệ }
        '401': { description: Cần token nhân viên }
        '403': { description: Không đúng quyền ADMIN/MANAGER chi nhánh }
        '404': { description: Không có đơn ở chi nhánh }
        '409': { description: PAYMENT_AMOUNT_MISMATCH hoặc PAYMENT_REFERENCE_CONFLICT hoặc PAYMENT_RECONCILIATION_REQUIRED }
        '422': { description: IDEMPOTENCY_KEY_REUSED }
        '429': { description: Vượt 20 payment POST/phút/IP }
