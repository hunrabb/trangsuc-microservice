  /api/pos/orders:
    post:
      operationId: createPosOrder
      summary: Tạo hoá đơn POS hoặc trả cùng hoá đơn đã tạo
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Cùng key và cùng branchId/bộ mã tem trả cùng id; thứ tự mã tem không có ý nghĩa.
        Key khác nội dung trả 422. Hết hàng trả 409 ITEM_NOT_AVAILABLE kèm details.tagCodes và orderId;
        giữ đơn CANCELLED không có dòng bán. Lỗi hạ tầng trả 503, không đổi thành hết hàng.
        Nếu trả kho lỗi, đơn giữ CANCELLING để request cùng key tiếp tục release.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePosOrderRequest' }
      responses:
        '201':
          description: Hoá đơn mới hoặc phát lại cùng key, snapshot lấy từ deduct
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PosOrder' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StockConflict' }
        '422':
          description: IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
