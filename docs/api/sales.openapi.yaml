      x-roles: [ADMIN, MANAGER, STAFF]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePosCustomerRequest' }
      responses:
        '201':
          description: Khách mới hoặc khách đã tồn tại
