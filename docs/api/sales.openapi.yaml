                  pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
              required:
                - "customerId"
              additionalProperties: false
            - type: "object"
              properties:
                name:
                  type: "string"
                  minLength: 1
                  maxLength: 150
                phone:
                  type: "string"
                  minLength: 9
                  maxLength: 32
              required:
                - "name"
                - "phone"
              additionalProperties: false
        notes:
          default: null
          anyOf:
            - type: "string"
              minLength: 1
              maxLength: 2000
            - type: "null"
        items:
          minItems: 1
          maxItems: 20
          type: "array"
          items:
            type: "object"
            properties:
              source:
                type: "string"
                enum:
                  - "STORE_TAG"
                  - "EXTERNAL"
              referenceTagCode:
                default: null
                description: "Bắt buộc với STORE_TAG, phải null với EXTERNAL; chỉ là tham chiếu chưa xác minh"
                anyOf:
                  - type: "string"
                    minLength: 1
                    maxLength: 100
                  - type: "null"
              assetKind:
                type: "string"
                enum:
                  - "GOLD"
                  - "SILVER"
                  - "JEWELRY"
              description:
                type: "string"
                minLength: 1
                maxLength: 1000
              condition:
                type: "string"
                minLength: 1
                maxLength: 1000
              declaredWeight:
                default: null
                description: "Trọng lượng khách khai, đơn vị chỉ; chưa kiểm định"
                anyOf:
                  - type: "string"
                    pattern: "^\\d{1,8}(\\.\\d{1,4})?$"
