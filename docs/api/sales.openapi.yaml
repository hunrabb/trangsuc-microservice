components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Order:
      description: Snapshot hoá đơn
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PosOrder' }
    ValidationError:
      description: VALIDATION_FAILED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthenticationError:
      description: INVALID_TOKEN hoặc TOKEN_EXPIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: FORBIDDEN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidState:
      description: INVALID_STATE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    StockConflict:
      description: ITEM_NOT_AVAILABLE hoặc METAL_PRICE_NOT_SET
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: SERVICE_UNAVAILABLE, gửi lại cùng key để tiếp tục
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
