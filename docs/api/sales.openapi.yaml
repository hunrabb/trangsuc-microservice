  /api/pos/orders/{id}/cancel:
    post:
      operationId: cancelPosOrder
      summary: Huỷ đơn chờ thanh toán và trả kho
      x-roles: [ADMIN, MANAGER, STAFF]
      description: >-
        Giành CANCELLING trước HTTP release để ngăn xác nhận tiền đồng thời.
        Release thành công mới ghi CANCELLED, lịch sử, AuditLog và outbox.
        Gọi lại tiếp tục CANCELLING; đã COMPLETED/CANCELLED trả 409, không release.
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/pos/customers:
