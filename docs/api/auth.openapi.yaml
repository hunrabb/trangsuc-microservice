openapi: 3.1.0
info:
  title: Auth API
  version: 1.0.0
  description: 'API của auth-service cho nhân viên. Mọi đường viết theo **đường ở gateway**.


    - `x-roles`: vai trò được gọi.

    - `x-audience`: `aud` access token phải có.

    - Mọi lỗi theo `ErrorResponse`; `x-error-codes` liệt kê mã có thể trả.

    - `/api/auth/*` công khai ở gateway: endpoint cần đăng nhập do auth kiểm tra. `/api/admin/auth/*` do gateway
    kiểm tra token, auth kiểm tra lại.

    - Thay đổi có `version` dùng khoá lạc quan: lệch → `409 VERSION_CONFLICT`.

    - `/api/admin/auth/*` kiểm quyền theo vai trò hiện tại trong DB, không theo vai trò trong token.

    - Thao tác sửa nhân viên có khoá dòng: chờ khoá quá 3 giây → `503 SERVICE_UNAVAILABLE`, client thử lại.

    - `components/schemas` sinh từ zod trong `libs/contracts` bằng `pnpm openapi:generate`, không sửa tay. Riêng
    `paths` viết tay.'
tags:
- name: Xác thực
- name: Chi nhánh
- name: Nhân viên
paths:
  /api/auth/google:
    post:
      operationId: loginWithGoogle
      tags:
      - Xác thực
      summary: Đăng nhập nhân viên bằng Google
      description: ID token sai → 401. Email chưa được cấp quyền, tài khoản bị khoá hoặc không có vai trò → 403,
        không tạo gì. Lần đầu ghép Google ghi `AuditLog`. Không lấy được khoá của Google → 503. Tối đa 20 lần mỗi
        phút theo IP.
      x-roles:
      - công khai
      x-audience: không yêu cầu token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Thành công, đặt cookie refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Set-Cookie:
              description: '`rt_bo=...; HttpOnly; Secure; SameSite=Strict; Path=/api/auth`'
              schema:
                type: string
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_CREDENTIALS'
          x-error-codes:
          - INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: ACCOUNT_NOT_PROVISIONED'
          x-error-codes:
          - ACCOUNT_NOT_PROVISIONED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Quá số lần thử: RATE_LIMITED'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Số giây phải chờ trước khi thử lại
              schema:
                type: integer
        '503':
          description: 'Tạm thời không sẵn sàng: SERVICE_UNAVAILABLE'
          x-error-codes:
          - SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      operationId: loginWithPassword
      tags:
      - Xác thực
      summary: Đăng nhập bằng mật khẩu, chỉ ADMIN
      description: Mọi trường hợp không thành công (sai email, sai mật khẩu, không phải ADMIN, bị khoá) trả cùng
        `401 INVALID_CREDENTIALS`. Tối đa 5 lần mỗi phút theo IP + email và 20 lần mỗi phút theo IP. Ghi `AuditLog`
        cho cả thành công và thất bại.
      x-roles:
      - công khai
      x-audience: không yêu cầu token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Thành công, đặt cookie refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Set-Cookie:
              description: '`rt_bo=...; HttpOnly; Secure; SameSite=Strict; Path=/api/auth`'
              schema:
                type: string
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_CREDENTIALS'
          x-error-codes:
          - INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Quá số lần thử: RATE_LIMITED'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Số giây phải chờ trước khi thử lại
              schema:
                type: integer
  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Xác thực
      summary: Xoay vòng refresh token
      description: Hết hạn trượt 7 ngày hoặc hạn tuyệt đối 30 ngày, hoặc không có cookie → 401, xoá cookie. Token
        vừa bị thay trong 10 giây gần đây (hai tab refresh cùng lúc) → 409, không thu hồi phiên, client gửi lại
        là được. Token đã thu hồi lâu hơn thế bị dùng lại → coi là bị đánh cắp, thu hồi mọi phiên của user, 401.
        Tối đa 60 lần mỗi phút theo IP.
      x-roles:
      - công khai
      x-audience: không yêu cầu access token
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Token mới, đặt cookie refresh mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Set-Cookie:
              description: '`rt_bo=...; HttpOnly; Secure; SameSite=Strict; Path=/api/auth`'
              schema:
                type: string
        '401':
          description: 'Chưa xác thực: SESSION_EXPIRED'
          x-error-codes:
          - SESSION_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: REFRESH_CONFLICT'
          x-error-codes:
          - REFRESH_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Quá số lần thử: RATE_LIMITED'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Số giây phải chờ trước khi thử lại
              schema:
                type: integer
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - Xác thực
      summary: Đăng xuất phiên hiện tại
      description: Không có cookie hoặc cookie hết hạn vẫn trả 204.
      x-roles:
      - công khai
      x-audience: không yêu cầu access token
      security:
      - refreshCookie: []
      responses:
        '204':
          description: Đã thu hồi phiên, xoá cookie
          headers:
            Set-Cookie:
              description: Xoá cookie `rt_bo`
              schema:
                type: string
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - Xác thực
      summary: Thông tin người dùng hiện tại
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User, vai trò theo chi nhánh, đã liên kết Google chưa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/change-password:
    post:
      operationId: changePassword
      tags:
      - Xác thực
      summary: Đổi mật khẩu của chính mình
      description: '`currentPassword` sai → `401 INVALID_CREDENTIALS`. Mật khẩu mới không đạt hoặc trùng mật khẩu
        cũ → `400 PASSWORD_TOO_WEAK`. Thu hồi mọi phiên khác, giữ phiên của cookie `rt_bo` đang gửi. Tối đa 5 lần
        mỗi 15 phút theo user và 20 lần mỗi phút theo IP; gateway kiểm access token trước khi đếm.'
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đã đổi, thu hồi các phiên khác
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED, PASSWORD_TOO_WEAK'
          x-error-codes:
          - VALIDATION_FAILED
          - PASSWORD_TOO_WEAK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED, INVALID_CREDENTIALS'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          - INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Quá số lần thử: RATE_LIMITED'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Số giây phải chờ trước khi thử lại
              schema:
                type: integer
  /api/auth/logout-all:
    post:
      operationId: logoutAll
      tags:
      - Xác thực
      summary: Đăng xuất mọi phiên
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Đã thu hồi mọi phiên
          headers:
            Set-Cookie:
              description: Xoá cookie `rt_bo`
              schema:
                type: string
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/branches:
    get:
      operationId: listBranches
      tags:
      - Chi nhánh
      summary: Danh sách chi nhánh
      description: Phân trang, sắp theo `code`.
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Một trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createBranch
      tags:
      - Chi nhánh
      summary: Tạo chi nhánh
      description: '`code` trùng → `400 VALIDATION_FAILED`, `details.fields` nêu trường.'
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Đã tạo, phát `branch.created`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/branches/{branchId}:
    parameters:
    - name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateBranch
      tags:
      - Chi nhánh
      summary: Sửa chi nhánh
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Đã sửa, phát `branch.updated`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: VERSION_CONFLICT'
          x-error-codes:
          - VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/branches/{branchId}/deactivate:
    parameters:
    - name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: deactivateBranch
      tags:
      - Chi nhánh
      summary: Ngừng hoạt động chi nhánh
      description: Chi nhánh đã ngừng rồi → `409 INVALID_STATE`. Vai trò ở chi nhánh này không còn vào token từ
        lần đăng nhập hoặc refresh kế tiếp.
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Đã ngừng, phát `branch.updated`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: INVALID_STATE'
          x-error-codes:
          - INVALID_STATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/users:
    get:
      operationId: listUsers
      tags:
      - Nhân viên
      summary: Danh sách nhân viên
      description: Phân trang, sắp theo `email`. MANAGER thiếu `branchId` hoặc gửi chi nhánh không do mình quản
        lý → `403 FORBIDDEN`.
      x-roles:
      - ADMIN (mọi chi nhánh)
      - MANAGER (chỉ chi nhánh của mình, `branchId` bắt buộc)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: branchId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Một trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createUser
      tags:
      - Nhân viên
      summary: Tạo nhân viên
      description: '`password` bắt buộc khi và chỉ khi có vai trò ADMIN. `email` trùng hoặc chi nhánh không dùng
        được → `400 VALIDATION_FAILED`. Email lưu chữ thường.'
      x-roles:
      - ADMIN
      - MANAGER (chỉ tạo STAFF ở chi nhánh của mình)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED, PASSWORD_TOO_WEAK'
          x-error-codes:
          - VALIDATION_FAILED
          - PASSWORD_TOO_WEAK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getUser
      tags:
      - Nhân viên
      summary: Xem nhân viên
      x-roles:
      - ADMIN
      - MANAGER (chỉ STAFF ở chi nhánh của mình)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
