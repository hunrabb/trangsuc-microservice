components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: rt_bo
  schemas:
    ErrorResponse:
      type: "object"
      properties:
        code:
          type: "string"
          enum:
            - "VALIDATION_FAILED"
            - "INVALID_CREDENTIALS"
            - "ACCOUNT_NOT_PROVISIONED"
            - "SESSION_EXPIRED"
            - "REFRESH_CONFLICT"
            - "PASSWORD_TOO_WEAK"
            - "INVALID_TOKEN"
            - "TOKEN_EXPIRED"
            - "FORBIDDEN"
            - "NOT_FOUND"
            - "METHOD_NOT_ALLOWED"
            - "VERSION_CONFLICT"
            - "INVALID_STATE"
            - "LAST_ADMIN"
            - "IDEMPOTENCY_KEY_REUSED"
            - "PAYLOAD_TOO_LARGE"
            - "RATE_LIMITED"
            - "SERVICE_UNAVAILABLE"
            - "INTERNAL_ERROR"
        message:
          type: "string"
        details:
          type: "object"
          propertyNames:
            type: "string"
          additionalProperties: {}
        correlationId:
          type: "string"
      required:
        - "code"
        - "message"
        - "correlationId"
      additionalProperties: false
    Role:
      type: "string"
      enum:
        - "ADMIN"
        - "MANAGER"
        - "STAFF"
    Assignment:
      type: "object"
      properties:
        branchId:
          anyOf:
            - type: "string"
              format: "uuid"
              pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
            - type: "null"
        role:
          $ref: "#/components/schemas/Role"
      required:
        - "branchId"
        - "role"
      additionalProperties: false
    AuthUser:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
        email:
          type: "string"
          format: "email"
          pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        fullName:
          type: "string"
        branches:
          type: "array"
          items:
            $ref: "#/components/schemas/Assignment"
      required:
        - "id"
        - "email"
        - "fullName"
        - "branches"
      additionalProperties: false
    CurrentUser:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
        email:
          type: "string"
          format: "email"
          pattern: "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        fullName:
