components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: rt_bo
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        correlationId:
          type: string
    Role:
      type: string
      enum:
      - ADMIN
      - MANAGER
      - STAFF
    Assignment:
      type: object
      additionalProperties: false
      required:
      - branchId
      - role
      properties:
        branchId:
          type:
          - string
          - 'null'
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
      description: ADMIN có `branchId = null`; MANAGER, STAFF bắt buộc có `branchId`.
    AuthUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - fullName
      - branches
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    CurrentUser:
      allOf:
      - $ref: '#/components/schemas/AuthUser'
      - type: object
        required:
        - googleLinked
        properties:
          googleLinked:
            type: boolean
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Số giây, 900
        user:
          $ref: '#/components/schemas/AuthUser'
    GoogleLoginRequest:
      type: object
      additionalProperties: false
      required:
      - credential
      properties:
        credential:
          type: string
          description: ID token từ Google Identity Services
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
          description: Tối thiểu 12 ký tự, tối đa 72 byte UTF-8 (giới hạn của bcrypt). Sai → `PASSWORD_TOO_WEAK`.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - newPassword
      properties:
        newPassword:
          type: string
          minLength: 12
          description: Tối thiểu 12 ký tự, tối đa 72 byte UTF-8 (giới hạn của bcrypt). Sai → `PASSWORD_TOO_WEAK`.
    Branch:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - address
      - phone
      - isActive
      - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        version:
          type: integer
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        address:
          type: string
        phone:
          type: string
    UpdateBranchRequest:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
        name:
          type: string
          minLength: 1
        address:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - fullName
      - phone
      - status
      - googleLinked
      - branches
      - version
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
        googleLinked:
          type: boolean
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        version:
          type: integer
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - fullName
      - assignments
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
        assignments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Assignment'
        password:
          type: string
          minLength: 12
          description: Bắt buộc khi và chỉ khi có vai trò ADMIN. Tối thiểu 12 ký tự, tối đa 72 byte UTF-8 (giới
            hạn của bcrypt). Sai → `PASSWORD_TOO_WEAK`.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
        fullName:
          type: string
          minLength: 1
        phone:
          type:
          - string
          - 'null'
    ReplaceAssignmentsRequest:
      type: object
      additionalProperties: false
      required:
      - assignments
      properties:
        assignments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Assignment'
        password:
          type: string
          minLength: 12
          description: Bắt buộc khi thêm vai trò ADMIN. Tối thiểu 12 ký tự, tối đa 72 byte UTF-8 (giới hạn của bcrypt).
            Sai → `PASSWORD_TOO_WEAK`.
