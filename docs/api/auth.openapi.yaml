openapi: 3.1.0
info:
  title: Auth API
  version: 1.0.0
  description: 'API của auth-service cho nhân viên. Mọi đường viết theo **đường ở gateway**.


    - `x-roles`: vai trò được gọi.

    - `x-audience`: `aud` access token phải có.

    - Mọi lỗi theo `ErrorResponse`; `x-error-codes` liệt kê mã có thể trả.

    - `/api/auth/*` công khai ở gateway: endpoint cần đăng nhập do auth kiểm tra. `/api/admin/auth/*` do gateway
    kiểm tra token, auth kiểm tra lại.

    - Thay đổi có `version` dùng khoá lạc quan: lệch → `409 VERSION_CONFLICT`.

    - Schema zod tương ứng nằm trong `libs/contracts/src/auth-api.ts`.'
tags:
- name: Xác thực
- name: Chi nhánh
- name: Nhân viên
paths:
  /api/auth/google:
    post:
      operationId: loginWithGoogle
      tags:
      - Xác thực
      summary: Đăng nhập nhân viên bằng Google
      description: ID token sai → 401. Email chưa được cấp quyền hoặc tài khoản bị khoá → 403. Lần đầu ghép Google
        ghi `AuditLog`.
      x-roles:
      - công khai
      x-audience: không yêu cầu token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Thành công, đặt cookie refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Set-Cookie:
              description: '`rt_bo=...; HttpOnly; Secure; SameSite=Strict; Path=/api/auth`'
              schema:
                type: string
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_CREDENTIALS'
          x-error-codes:
          - INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: ACCOUNT_NOT_PROVISIONED'
          x-error-codes:
          - ACCOUNT_NOT_PROVISIONED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      operationId: loginWithPassword
      tags:
      - Xác thực
      summary: Đăng nhập bằng mật khẩu, chỉ ADMIN
      description: Mọi trường hợp không thành công (sai email, sai mật khẩu, không phải ADMIN, bị khoá) trả cùng
        `401 INVALID_CREDENTIALS`. Tối đa 5 lần thử mỗi phút mỗi IP.
      x-roles:
      - công khai
      x-audience: không yêu cầu token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Thành công, đặt cookie refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Set-Cookie:
              description: '`rt_bo=...; HttpOnly; Secure; SameSite=Strict; Path=/api/auth`'
              schema:
                type: string
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_CREDENTIALS'
          x-error-codes:
          - INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Quá số lần thử: RATE_LIMITED'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags:
      - Xác thực
      summary: Xoay vòng refresh token
      description: Hết hạn trượt 7 ngày hoặc hạn tuyệt đối 30 ngày → 401. Token đã thu hồi bị dùng lại → thu hồi
        mọi phiên của user, 401.
      x-roles:
      - công khai
      x-audience: không yêu cầu access token
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Token mới, đặt cookie refresh mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Set-Cookie:
              description: '`rt_bo=...; HttpOnly; Secure; SameSite=Strict; Path=/api/auth`'
              schema:
                type: string
        '401':
          description: 'Chưa xác thực: SESSION_EXPIRED'
          x-error-codes:
          - SESSION_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      operationId: logout
      tags:
      - Xác thực
      summary: Đăng xuất phiên hiện tại
      description: Không có cookie hoặc cookie hết hạn vẫn trả 204.
      x-roles:
      - công khai
      x-audience: không yêu cầu access token
      security:
      - refreshCookie: []
      responses:
        '204':
          description: Đã thu hồi phiên, xoá cookie
          headers:
            Set-Cookie:
              description: Xoá cookie `rt_bo`
              schema:
                type: string
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - Xác thực
      summary: Thông tin người dùng hiện tại
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User, vai trò theo chi nhánh, đã liên kết Google chưa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/change-password:
    post:
      operationId: changePassword
      tags:
      - Xác thực
      summary: Đổi mật khẩu của chính mình
      description: '`currentPassword` sai → `401 INVALID_CREDENTIALS`.'
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đã đổi, thu hồi các phiên khác
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED, PASSWORD_TOO_WEAK'
          x-error-codes:
          - VALIDATION_FAILED
          - PASSWORD_TOO_WEAK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED, INVALID_CREDENTIALS'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          - INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout-all:
    post:
      operationId: logoutAll
      tags:
      - Xác thực
      summary: Đăng xuất mọi phiên
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Đã thu hồi mọi phiên
          headers:
            Set-Cookie:
              description: Xoá cookie `rt_bo`
              schema:
                type: string
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/branches:
    get:
      operationId: listBranches
      tags:
      - Chi nhánh
      summary: Danh sách chi nhánh
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createBranch
      tags:
      - Chi nhánh
      summary: Tạo chi nhánh
      description: '`code` trùng → `400 VALIDATION_FAILED`, `details.fields` nêu trường.'
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Đã tạo, phát `branch.created`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/branches/{branchId}:
    parameters:
    - name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateBranch
      tags:
      - Chi nhánh
      summary: Sửa chi nhánh
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Đã sửa, phát `branch.updated`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: VERSION_CONFLICT'
          x-error-codes:
          - VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/branches/{branchId}/deactivate:
    parameters:
    - name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: deactivateBranch
      tags:
      - Chi nhánh
      summary: Ngừng hoạt động chi nhánh
      description: Chi nhánh đã ngừng rồi → `409 INVALID_STATE`.
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Đã ngừng, phát `branch.updated`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: INVALID_STATE'
          x-error-codes:
          - INVALID_STATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/users:
    get:
      operationId: listUsers
      tags:
      - Nhân viên
      summary: Danh sách nhân viên
      x-roles:
      - ADMIN (mọi chi nhánh)
      - MANAGER (chỉ chi nhánh của mình, `branchId` bắt buộc)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      parameters:
      - name: branchId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createUser
      tags:
      - Nhân viên
      summary: Tạo nhân viên
      description: '`password` bắt buộc khi và chỉ khi có vai trò ADMIN. `email` trùng → `400 VALIDATION_FAILED`.'
      x-roles:
      - ADMIN
      - MANAGER (chỉ tạo STAFF ở chi nhánh của mình)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED, PASSWORD_TOO_WEAK'
          x-error-codes:
          - VALIDATION_FAILED
          - PASSWORD_TOO_WEAK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getUser
      tags:
      - Nhân viên
      summary: Xem nhân viên
      x-roles:
      - ADMIN
      - MANAGER (chỉ STAFF ở chi nhánh của mình)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Chi tiết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateUser
      tags:
      - Nhân viên
      summary: Sửa nhân viên
      x-roles:
      - ADMIN
      - MANAGER (chỉ STAFF ở chi nhánh của mình)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Đã sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: VERSION_CONFLICT'
          x-error-codes:
          - VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/users/{userId}/lock:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: lockUser
      tags:
      - Nhân viên
      summary: Khoá tài khoản
      description: Thu hồi mọi phiên. Đã khoá rồi → `409 INVALID_STATE`.
      x-roles:
      - ADMIN
      - MANAGER (chỉ STAFF ở chi nhánh của mình)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Đã thực hiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: INVALID_STATE'
          x-error-codes:
          - INVALID_STATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/users/{userId}/unlock:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: unlockUser
      tags:
      - Nhân viên
      summary: Mở khoá tài khoản
      description: Chưa khoá → `409 INVALID_STATE`.
      x-roles:
      - ADMIN
      - MANAGER (chỉ STAFF ở chi nhánh của mình)
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Đã thực hiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
