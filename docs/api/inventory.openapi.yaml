  /api/admin/inventory/items/summary:
    get:
      operationId: getStockSummary
      tags: [Tồn kho]
      summary: Tổng hợp số chiếc theo biến thể trong một chi nhánh
      description: >-
        Bắt buộc branchId. ADMIN hoặc MANAGER/STAFF được phân công chi nhánh.
        Khả dụng là IN_STOCK với kho, mẫu, danh mục, biến thể, kim loại hoạt động và có giá hiệu lực.
        RESERVED chỉ tính giữ hiệu lực ACTIVE/PAID_HELD hoặc Exchange ACTIVE/PROTECTED chưa hết hạn.
        Giữ hết hạn/chờ đối soát và hàng ngừng bán nằm ở other, không tính khả dụng.
        SOLD phản ánh trạng thái Inventory, bao gồm POS đã trừ kho trước xác nhận thanh toán.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: variantId
          schema: {type: string, format: uuid}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: pageSize
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Một snapshot PostgreSQL, phân trang theo biến thể
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockSummaryPage'
        '400':
          description: Query không hợp lệ
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không có quyền tại chi nhánh

