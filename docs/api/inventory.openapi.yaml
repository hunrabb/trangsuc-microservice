          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMetalPrice
      tags:
      - Kim loại và giá
      summary: Nhập giá mới
      description: Chỉ ghi thêm, không sửa giá cũ. Giá tính bằng đồng / chỉ. Ghi `AuditLog` và outbox cùng transaction.
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetalPriceRequest'
      responses:
        '201':
          description: Đã ghi, phát `metal_price.changed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetalPrice'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
