openapi: 3.1.0
info:
  title: Inventory API
  version: 1.0.0
  description: 'API của inventory-service cho nhân viên. Mọi đường viết theo **đường ở gateway**.


    - `x-roles`: vai trò được gọi.

    - `x-audience`: `aud` access token phải có.

    - Mọi lỗi theo `ErrorResponse`; `x-error-codes` liệt kê mã có thể trả.

    - Tiền (đồng) và trọng lượng (chỉ) là chuỗi số thập phân.

    - Thay đổi có `version` dùng khoá lạc quan: lệch → `409 VERSION_CONFLICT`.

    - `components/schemas` sinh từ zod trong `libs/contracts` bằng `pnpm openapi:generate`, không sửa tay. Riêng
    `paths` viết tay.'
tags:
- name: Kim loại và giá
- name: Danh mục và sản phẩm
- name: Phiếu nhập
- name: Tồn kho
paths:
  /internal/exchanges/reserve:
    servers: [{ url: 'http://inventory:3000' }]
    post:
      operationId: reserveExchangeItem
      x-internal: true
      security: []
      summary: Atomically reserve a tagged item for an exchange, idempotent by exchangeId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveExchange' }
      responses:
        '200': { description: Frozen sale price and hold expiry, content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeHold' } } } }
        '409': { description: Item unavailable or price missing }
  /internal/exchanges/{exchangeId}:
    servers: [{ url: 'http://inventory:3000' }]
    get:
      operationId: getExchangeHold
      x-internal: true
      security: []
      parameters:
        - { name: exchangeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Hold snapshot or null, content: { application/json: { schema: { anyOf: [ { $ref: '#/components/schemas/ExchangeHold' }, { type: 'null' } ] } } } }
  /internal/exchanges/{exchangeId}/protect:
    servers: [{ url: 'http://inventory:3000' }]
    post:
      operationId: protectPaidExchangeHold
      x-internal: true
      security: []
      parameters:
        - { name: exchangeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Paid hold retained for bounded recovery, content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeHold' } } } }
        '409': { description: Hold expired or released }
  /internal/exchanges/{exchangeId}/consume:
    servers: [{ url: 'http://inventory:3000' }]
    post:
      operationId: consumeExchangeHold
      x-internal: true
      security: []
      parameters:
        - { name: exchangeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Idempotent SOLD snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeHold' } } } }
        '409': { description: Paid hold missing or expired }
  /internal/exchanges/release:
    servers: [{ url: 'http://inventory:3000' }]
    post:
      operationId: releaseExchangeHold
      x-internal: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeRelease' }
      responses:
        '200': { description: Idempotent release or tombstone }
        '409': { description: Payment protected or item consumed }
  /internal/buyback-prices/{metalId}:
    get:
      operationId: internalBuybackPrice
      summary: Current Inventory buy rate for the selected alloy; internal network only
      security: []
      x-internal: true
      description: Gateway never routes /internal. Read only. No sellPrice fallback. Inventory time
        chooses effective price; no purity multiplication.
      parameters:
        - in: path
          name: metalId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current buy price, source identity and capture time; unit VND_PER_CHI_ALLOY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryBuybackPrice"
        "404":
          description: Metal not found
        "409":
          description: "METAL_PRICE_NOT_SET: inactive metal or missing valid buy rate"
  /internal/stock/orders/{orderId}:
    servers: [{ url: 'http://inventory:3000' }]
    get:
      operationId: getInternalStockOrderState
      summary: Đọc dấu giải phóng và các chiếc đã bán cho một đơn POS để phục hồi
      x-internal: true
      security: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Snapshot nhất quán từ kho
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockOrderStateResponse' }
        '400':
          description: orderId không hợp lệ
  /internal/stock/quote:
    servers: [{ url: 'http://inventory:3000' }]
    post:
      operationId: quoteInternalStock
      summary: Báo giá nội bộ cho POS, không đi qua gateway
      x-internal: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteStockRequest' }
      responses:
        '200':
          description: Mã tem kèm giá tham khảo hoặc lý do không bán được
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteStockResponse' }
        '400':
          description: VALIDATION_FAILED
  /internal/stock/deduct:
    servers: [{ url: 'http://inventory:3000' }]
    post:
      operationId: deductInternalStock
      summary: Trừ hàng nguyên tử và chốt giá, idempotent theo orderId
      x-internal: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeductStockRequest' }
      responses:
        '200':
          description: Snapshot giá và productName cho hoá đơn; replay trả giá đã chốt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeductStockResponse' }
        '400':
          description: VALIDATION_FAILED
        '409':
          description: ITEM_NOT_AVAILABLE, METAL_PRICE_NOT_SET hoặc INVALID_STATE
        '422':
          description: IDEMPOTENCY_KEY_REUSED
        '503':
          description: SERVICE_UNAVAILABLE
  /internal/stock/release:
    servers: [{ url: 'http://inventory:3000' }]
    post:
      operationId: releaseInternalStock
      summary: Trả hàng theo orderId, gọi lại không ghi sổ kho trùng
      x-internal: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseStockRequest' }
      responses:
        '200':
          description: Các mã tem đã trả, rỗng nếu đã trả trước đó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseStockResponse' }
        '400':
          description: VALIDATION_FAILED
        '503':
          description: SERVICE_UNAVAILABLE
  /api/admin/inventory/online-catalog/warehouses/{warehouseId}:
    put:
      operationId: configureOnlineWarehouse
      summary: ADMIN bật hoặc tắt nhận đơn online của kho
      x-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      x-audience: store-backoffice
      parameters:
        - { in: path, name: warehouseId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineWarehouse' }
      responses:
        '200': { description: ID và acceptsOnlineOrders đã lưu }
        '400': { description: Query/body không hợp lệ }
        '401': { description: Chưa đăng nhập }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không có kho }
  /api/admin/inventory/online-catalog/warehouses/{warehouseId}/buffers/{variantId}:
    put:
      operationId: configureOnlineBuffer
      summary: ADMIN cấu hình lượng hàng để lại cho POS theo kho và biến thể
      x-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      x-audience: store-backoffice
      parameters:
        - { in: path, name: warehouseId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: variantId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlineBuffer' }
      responses:
        '200': { description: "warehouseId, variantId, quantity đã lưu" }
        '400': { description: Body không hợp lệ }
        '401': { description: Chưa đăng nhập }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không có kho hoặc biến thể }

  /api/admin/inventory/metals:
    get:
      operationId: listMetals
      tags:
      - Kim loại và giá
      summary: Danh sách kim loại
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metal'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMetal
      tags:
      - Kim loại và giá
      summary: Tạo kim loại
      description: '`code` trùng → `400 VALIDATION_FAILED`, `details.fields` nêu trường.'
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetalRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metal'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: INVALID_STATE'
          x-error-codes:
          - INVALID_STATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/inventory/metals/{metalId}/price:
    parameters:
    - name: metalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getCurrentMetalPrice
      tags:
      - Kim loại và giá
      summary: Giá hiện tại của kim loại
      description: Chưa có giá nào có hiệu lực → `409 METAL_PRICE_NOT_SET`.
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Dòng có `effectiveFrom` mới nhất không quá thời điểm hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetalPrice'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: METAL_PRICE_NOT_SET'
          x-error-codes:
          - METAL_PRICE_NOT_SET
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/inventory/metals/{metalId}/prices:
    parameters:
    - name: metalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listMetalPrices
      tags:
      - Kim loại và giá
      summary: Lịch sử giá kim loại
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Một trang, mới nhất trước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetalPricePage'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMetalPrice
      tags:
      - Kim loại và giá
      summary: Nhập giá mới
      description: Chỉ ghi thêm, không sửa giá cũ. Giá tính bằng đồng / chỉ. Ghi `AuditLog` và outbox cùng transaction.
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetalPriceRequest'
      responses:
        '201':
          description: Đã ghi, phát `metal_price.changed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetalPrice'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/inventory/categories:
    get:
      operationId: listCategories
      tags:
      - Danh mục và sản phẩm
      summary: Danh sách danh mục
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createCategory
      tags:
      - Danh mục và sản phẩm
      summary: Tạo danh mục
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/inventory/categories/{categoryId}:
    parameters:
    - name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateCategory
      tags:
      - Danh mục và sản phẩm
      summary: Sửa danh mục
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Đã sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Không tìm thấy: NOT_FOUND'
          x-error-codes:
          - NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Xung đột: VERSION_CONFLICT'
          x-error-codes:
          - VERSION_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/inventory/products:
    get:
      operationId: listProducts
      tags:
      - Danh mục và sản phẩm
      summary: Danh sách mẫu
      x-roles:
      - ADMIN
      - MANAGER
      - STAFF
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Một trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createProduct
      tags:
      - Danh mục và sản phẩm
      summary: Tạo mẫu
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
          x-error-codes:
          - VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Chưa xác thực: INVALID_TOKEN, TOKEN_EXPIRED'
          x-error-codes:
          - INVALID_TOKEN
          - TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Không có quyền: FORBIDDEN'
          x-error-codes:
          - FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/inventory/products/{productId}:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateProduct
      tags:
      - Danh mục và sản phẩm
      summary: Sửa mẫu
      x-roles:
      - ADMIN
      x-audience: store-backoffice
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Đã sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Dữ liệu không hợp lệ: VALIDATION_FAILED'
