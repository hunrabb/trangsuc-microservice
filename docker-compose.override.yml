# Chỉ dùng trên máy development: Docker Compose tự gộp file này khi chạy `docker compose up`.
# Bốn DB mới chỉ mở cổng loopback để `pnpm dev`/Prisma trên host không đụng DB legacy.
services:
  auth-postgres:
    ports:
      - '127.0.0.1:15433:5432'
  inventory-postgres:
    ports:
      - '127.0.0.1:15434:5432'
  sales-postgres:
    ports:
      - '127.0.0.1:15435:5432'
  report-postgres:
    ports:
      - '127.0.0.1:15436:5432'
  postgres:
    # Chỉ profile legacy-db mới chạy container cũ; giữ cổng này nếu rollback có kiểm soát.
    ports:
      - '127.0.0.1:5432:5432'
  rabbitmq:
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
